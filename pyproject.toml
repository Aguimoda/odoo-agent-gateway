[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "odoo-agent-gateway"
dynamic = ["version"]
description = "A permission-aware MCP gateway that lets AI agents work on Odoo as the person asking, never as an administrator."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Moreno de Aguinaga" }]
dependencies = [
  "fastapi>=0.115",
  "mcp>=2.3,<3",
  "httpx2>=2.16",
  "uvicorn>=0.30",
  "asyncpg>=0.30",
]

[project.scripts]
odoo-agent-gateway = "odoo_agent_gateway.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "src/odoo_agent_gateway/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: needs the Docker stack and demo data (run with: pytest -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
