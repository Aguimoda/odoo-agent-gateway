name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: pytest

  web:
    name: Web app (type check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Permission-leak and browser suite (real Odoo 18)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GATEWAY_MODEL_CACHE: ${{ github.workspace }}/.cache/models
      # Odoo's container reaches the browser tests' gateway through the Docker bridge (M8).
      E2E_GATEWAY_BIND: 0.0.0.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: python -m pip install -e ".[dev,e2e]"
      - name: Build the web app
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Create throwaway database passwords
        run: >-
          python -c "import pathlib, secrets;
          s = pathlib.Path('.env.example').read_text();
          s = s.replace('change-me-odoo', secrets.token_urlsafe(18));
          s = s.replace('change-me-gateway', secrets.token_urlsafe(18));
          pathlib.Path('.env').write_text(s)"
      - name: Start Odoo and the databases
        run: docker compose up -d --wait
      - name: Wait for Odoo
        run: >-
          curl -sSf -o /dev/null --retry 30 --retry-delay 5 --retry-all-errors
          http://127.0.0.1:8069/web/login
      - name: Create demo data (Ana, Luis, Carmen, hostile records)
        run: python scripts/demo/setup_demo.py
      - name: Odoo module tests, inside Odoo (agent_gateway_connector)
        run: |
          out=$(docker compose run --rm -T odoo odoo -d addon_test -i agent_gateway_connector             --without-demo=all --test-enable --test-tags /agent_gateway_connector             --stop-after-init --no-http 2>&1)
          echo "$out" | grep -E "tests when|ERROR|FAIL" || true
          echo "$out" | grep -qE "0 failed, 0 error\(s\) of [1-9][0-9]* tests"
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .cache/models
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Build the knowledge index (indexer service account)
        run: |
          set -a; . ./.env.demo-keys; set +a
          python -m odoo_agent_gateway.index --docs scripts/demo/knowledge
      - name: Integration and browser tests
        run: pytest -m integration -v
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 200

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate configuration
        run: docker compose --env-file .env.example config -q

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
